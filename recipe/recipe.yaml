context:
  version: "0.17.0"

package:
  name: alacritty
  version: ${{ version }}

source:
  url: https://github.com/alacritty/alacritty/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 38d6527d346cda5c6049332a1f3338a89ea66cd7981b54d4c3ce801b392496f8

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - pkg-config
  host:
    - if: linux
      then:
        - fontconfig
        - expat
        - libxcb
        - libxkbcommon

tests:
  - script:
      - alacritty --version

about:
  homepage: https://alacritty.org/
  repository: https://github.com/alacritty/alacritty
  documentation: https://alacritty.org/
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  description: "A cross-platform, OpenGL terminal emulator."
  summary: "A cross-platform, OpenGL terminal emulator."

extra:
  recipe-maintainers:
    - VasanthakumarV
